[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voltplan"
version = "1.0.0"
description = "VoltPlan: построение и расчёт схем сетей 0,4 кВ, проекты, варианты, сценарии, обмен файлами .cir"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.5",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "scipy>=1.11",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "httpx>=0.27",
    "playwright>=1.40",
    "pywinauto>=0.6.8; sys_platform == 'win32'",
    "pillow>=10",
    "ruff>=0.5",
]

[project.scripts]
voltplan = "voltplan.__main__:main"

[tool.setuptools.packages.find]
include = ["voltplan*", "linecapacity*"]

[tool.setuptools.package-data]
voltplan = ["web/*", "web/css/*", "web/js/*", "web/i18n/*", "web/shots/*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not live and not linecapacity'"
markers = [
    "live: проверки в настоящем браузере",
    "linecapacity: сверка с программой LineCapacity",
]

[tool.ruff]
preview = true
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["voltplan", "linecapacity", "tests"]
